[package]
name = "tapp-cli"
version = "0.10.0"
edition.workspace = true
description = "Standalone CLI for TAPP gRPC server and on-chain operations"
license.workspace = true

[[bin]]
name = "tapp-cli"
path = "src/main.rs"

[dependencies]
tapp-common = { path = "../tapp-common" }

# CLI
clap = { version = "4.0", features = ["derive", "env"] }

# Runtime
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "net", "io-util"] }
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
anyhow = "1.0"

# Unix socket client support
tower = { version = "0.4", features = ["util"] }
http = "1.0"
hyper-util = { version = "0.1", features = ["tokio"] }

# Serialization (used in CLI output formatting)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
base64 = "0.22"
hex = "0.4"
sha3 = "0.10"
sha2 = "0.10"
prost = "0.13"
k256 = { version = "0.13", features = ["ecdsa", "std"] }
chrono = { version = "0.4", features = ["serde"] }

# Ethereum
ethers = { version = "2.0", default-features = false, features = ["legacy", "rustls"] }

# Error handling
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.23.0"

[features]
# Ledger support for --external-signer (--ledger). On by default on macOS, below; elsewhere
# opt in with --features ledger (Linux needs libudev at build and run time).
ledger = ["tapp-common/ledger"]

[target.'cfg(target_os = "macos")'.dependencies]
tapp-common = { path = "../tapp-common", features = ["ledger"] }
