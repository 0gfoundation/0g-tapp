# Build (and optionally publish + register) an og-tdx confidential VM image.
#
# DRAFT — requires a self-hosted Alinux/al8 runner (labels: self-hosted, alinux, cvm-builder)
# with: root, nbd, libguestfs, qemu-img, cryptpilot-convert + a #128-FIXED cryptpilot-fde
# (the stock 0.7.0 errors "saved_entry not found" on show-reference-value — see gcp-cvm
# cryptpilot-gcp-boot-fix.md §12), grpcurl, python3, gcloud + gsutil, network to the shared AS.
#
# Dimensions (see verifier/reference-values/README.md): version × env × owner.
#   version = tapp-server release tag (trigger)         → which tapp-server + image name suffix
#   env     = dev (HARDEN=0) | prod (HARDEN=1)          → image variant (og-tdx-dev / og-tdx)
#   owner   = OWNER_ADDRESS, baked into config.toml     → folded into the initrd measurement,
#             so it IS an attested dimension (per-owner reference values).
# KBS/KMS is fixed (vars.TAPP_KBS_URLS), not per-build.

name: build-cvm

on:
  workflow_dispatch:
    inputs:
      version:
        description: "tapp-server release tag (e.g. v0.1.0)"
        required: true
      env:
        description: "image variant"
        type: choice
        options: [dev, prod, both]
        default: both
      owner:
        description: "OWNER_ADDRESS (0x...) — baked into the image, measured"
        required: true
      publish:
        description: "publish to GCP + register reference values"
        type: boolean
        default: true

concurrency:
  group: build-cvm-${{ inputs.version }}-${{ inputs.owner }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, alinux, cvm-builder]
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(inputs.env == 'both' && '["dev","prod"]' || format('["{0}"]', inputs.env)) }}
    env:
      VERSION: ${{ inputs.version }}
      OWNER: ${{ inputs.owner }}
      KBS_URLS: ${{ vars.TAPP_KBS_URLS }}          # fixed, org/repo variable
      GCP_PROJECT: g-devops
      GCS_BUCKET: gs://tapp-image
      AS_ENDPOINT: 47.237.201.184:50004
      LIBGUESTFS_BACKEND: direct
    steps:
      - uses: actions/checkout@v4
        with: { ref: dev }

      - name: Resolve variant (env → HARDEN + image base)
        id: v
        run: |
          if [ "${{ matrix.env }}" = prod ]; then
            echo "harden=1"       >> "$GITHUB_OUTPUT"
            echo "imgbase=og-tdx"  >> "$GITHUB_OUTPUT"
          else
            echo "harden=0"           >> "$GITHUB_OUTPUT"
            echo "imgbase=og-tdx-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch build inputs (base image + fde deb)
        run: gcp-cvm/ci/fetch-inputs.sh "$VERSION"   # → gcp-cvm/base-noble.qcow2 + cryptpilot-fde_*.deb

      - name: Stage A+B — build the image
        run: |
          cd gcp-cvm
          HARDEN=${{ steps.v.outputs.harden }} ENABLE_SYSBOX=1 \
            OWNER_ADDRESS="$OWNER" KBS_URLS="$KBS_URLS" \
            TAPP_SERVER_URL="https://github.com/0gfoundation/0g-tapp/releases/download/${VERSION}/tapp-server" \
            ./build-gcp-tapp.sh base-noble.qcow2 "out-${{ matrix.env }}.qcow2"

      - name: Boot smoke test (gate)
        run: cd gcp-cvm && ./test/boot-smoke-test.sh "out-${{ matrix.env }}.qcow2"

      - name: Authenticate to GCP
        if: ${{ inputs.publish }}
        run: |
          printf '%s' "$GCP_SA_KEY" > /tmp/sa.json
          gcloud auth activate-service-account --key-file=/tmp/sa.json
          gcloud config set project "$GCP_PROJECT"
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Stage C — publish versioned image (+ family)
        if: ${{ inputs.publish }}
        run: |
          cd gcp-cvm
          IMG="${{ steps.v.outputs.imgbase }}-${VERSION//./-}"
          IMAGE_FAMILY="${{ steps.v.outputs.imgbase }}" \
            ./publish-gcp-image.sh "out-${{ matrix.env }}.qcow2" "$IMG"

      - name: Reference values — compute, write, register on AS
        if: ${{ inputs.publish }}
        run: |
          cd gcp-cvm
          # writes verifier/reference-values/<version>/<env>/<owner>.json from show-reference-value
          ci/gen-reference-values.sh "out-${{ matrix.env }}.qcow2" "$VERSION" "${{ matrix.env }}" "$OWNER"
          cd ..
          verifier/register-shared-as.sh "$VERSION" "${{ matrix.env }}" "$OWNER" "$AS_ENDPOINT"

      - name: Open PR with the new reference values → dev
        if: ${{ inputs.publish }}
        run: gcp-cvm/ci/open-refvalues-pr.sh "$VERSION" "${{ matrix.env }}" "$OWNER"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup build artifacts
        if: always()
        run: rm -f gcp-cvm/out-${{ matrix.env }}.qcow2 gcp-cvm/base-noble.qcow2 /tmp/sa.json
