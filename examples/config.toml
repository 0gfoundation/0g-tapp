# TAPP Service Configuration Example

[logging]
level = "info"  # Log level: "trace", "debug", "info", "warn", "error"
format = "json" # Log format: "json" or "pretty"
# file_path = "/var/log/tapp/app.log"  # Optional: log to file (daily rotation)
# max_log_files = 7  # Rotated daily files to keep; oldest deleted (default: 7)

[server]
bind_address = "0.0.0.0:50051"
# Unix socket path — when set, the server listens on this Unix domain socket
# IN ADDITION TO the TCP bind_address above (not instead of it), so remote clients
# keep using TCP while same-host clients use the socket. Recommended for local key
# retrieval: Docker containers mount the socket file instead of using
# extra_hosts: host.docker.internal:host-gateway.
# unix_socket_path = "/run/tapp/tapp.sock"
max_connections = 1000
request_timeout_seconds = 30
tls_enabled = false
# tls_cert_path = "/path/to/cert.pem"
# tls_key_path = "/path/to/key.pem"

# Permission-based Authentication Configuration
[server.permission]
enabled = true
# Owner is OPTIONAL: leave it unset and the tapp boots UNCLAIMED — the first
# valid signer of `tapp-cli claim-owner` becomes the owner, and the claim is
# extended into the runtime measurement (keeps the CVM image owner-independent).
# Setting it here is the legacy baked-in mode and still works:
# owner_address = "0xYourOwnerAddressHere"
#
# Where the claimed owner is persisted so a tapp-server restart within the
# same boot cannot reopen the claim (tmpfs: cleared on reboot, like the RTMRs):
# owner_state_path = "/run/tapp/claimed_owner"
#
# initial_whitelist was removed in 0.3 — use `tapp-cli add-to-whitelist`
# after claiming; every change is a measured runtime event.

[boot]
# aa_config_path = "/etc/tapp/attestation-agent.toml"

# KBS (Key Broker Service) Configuration
# If not configured, the service will use in-memory key generation
[kbs]
endpoint = "http://localhost:8080"
timeout_seconds = 30
# cert_path = "/path/to/kbs-ca.pem"

[kbs.retry]
max_retries = 3
initial_delay_ms = 1000
max_delay_ms = 30000

supported_key_types = ["ethereum", "rsa", "ec"]
